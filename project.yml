name: LitEnergy
options:
  bundleIdPrefix: com.litenergy
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEBUG_INFORMATION_FORMAT: dwarf
targets:
  LitEnergy:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.litenergy.vpn
        PRODUCT_NAME: LitEnergy
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/LitEnergy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PacketTunnel
        embed: true
      - sdk: NetworkExtension.framework
    scheme: {}
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - "*.entitlements"
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.litenergy.vpn.tunnel
        PRODUCT_NAME: PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
    dependencies:
      - framework: Libbox.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
      - sdk: UIKit.framework
      - sdk: UserNotifications.framework
